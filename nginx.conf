# -----------------------------------------------------------
# nginx.conf — Configuração para a landing page IVC Soft House
# -----------------------------------------------------------
server {
    listen 80;
    server_name ivcsofthouse.com.br www.ivcsofthouse.com.br;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(?:css|js|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip para textos
    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json;
    gzip_proxied any;
    gzip_min_length 1000;
}
